name: Verify and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: '21 6 * * 1'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/interop-requirements.txt
      - run: npm ci --include=dev
      - name: Check source and API behavior
        run: npm run typecheck && npm run lint && npm test
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - run: npm run test:interop
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-failures
          path: |
            playwright-report
            test-results
            .interop/server.log
          include-hidden-files: true
          retention-days: 7

  image:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: calendar:ci-${{ matrix.arch }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Exercise the hardened runtime
        run: python3 scripts/test-image.py calendar:ci-${{ matrix.arch }}
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.75.0
          image-ref: calendar:ci-${{ matrix.arch }}
          scanners: vuln
          format: json
          output: scan-${{ matrix.arch }}.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
      - name: Generate the software bill of materials
        run: trivy image --format spdx-json --output sbom-${{ matrix.arch }}.spdx.json calendar:ci-${{ matrix.arch }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: scan-${{ matrix.arch }}
          path: |
            scan-${{ matrix.arch }}.json
            sbom-${{ matrix.arch }}.spdx.json
          retention-days: 14
      - name: Save the tested image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: docker image save -o image-${{ matrix.arch }}.tar calendar:ci-${{ matrix.arch }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          name: image-${{ matrix.arch }}
          path: |
            image-${{ matrix.arch }}.tar
            sbom-${{ matrix.arch }}.spdx.json
          compression-level: 1
          retention-days: 1

  publish:
    needs: image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          path: images
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested images and version tags
        id: publish
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAGS: ${{ steps.metadata.outputs.tags }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          image = os.environ['IMAGE'].lower()
          version = os.environ['VERSION']
          tags = os.environ['TAGS'].splitlines()
          assert re.fullmatch(r'[A-Za-z0-9_][A-Za-z0-9_.-]{0,119}', version)
          assert tags and all(tag.startswith(image + ':') for tag in tags)
          sources = []
          outputs = {'image': image}
          def docker(*args):
              return subprocess.check_output(['docker', *args], text=True).strip()
          for arch in ['amd64', 'arm64']:
              docker('image', 'load', '-i', f'images/image-{arch}/image-{arch}.tar')
              target = f'{image}:{version}-{arch}'
              docker('tag', f'calendar:ci-{arch}', target)
              docker('push', target)
              outputs[f'{arch}-digest'] = docker('buildx', 'imagetools', 'inspect', target, '--format', '{{.Manifest.Digest}}')
              sources.append(target)
          args = ['buildx', 'imagetools', 'create']
          for tag in tags:
              args.extend(['--tag', tag])
          docker(*args, *sources)
          outputs['digest'] = docker('buildx', 'imagetools', 'inspect', tags[0], '--format', '{{.Manifest.Digest}}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as file:
              for key, value in outputs.items():
                  file.write(f'{key}={value}\n')
          PY
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-sbom@51e74621a501c89df81fc1391c5a8f4cfc9fab2f # v3
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.amd64-digest }}
          sbom-path: images/image-amd64/sbom-amd64.spdx.json
          push-to-registry: true
      - uses: actions/attest-sbom@51e74621a501c89df81fc1391c5a8f4cfc9fab2f # v3
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.arm64-digest }}
          sbom-path: images/image-arm64/sbom-arm64.spdx.json
          push-to-registry: true
